name: Hourly Coze Workflow Trigger

# 配置触发条件
on:
  schedule:
    # 💡 优化：改为每小时的第 15 分钟执行一次（避开 0 分钟的全球整点排队高峰，提高稳定性）
    # 基于 UTC 时间，例如 01:15, 02:15 ...
    - cron: '15 * * * *'

  # 允许你在 GitHub 页面上手动点击按钮触发，方便测试
  workflow_dispatch:

jobs:
  trigger_coze:
    name: Trigger Coze Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Send Webhook Request to Coze
        run: |
          echo "Starting to trigger Coze workflow..."

          curl -X POST "https://api.coze.cn/api/trigger/v1/webhook/biz_id/bot_platform/hook/1000000000720249346" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer SjupRayv" \
            -d '{}'

          echo "Trigger request sent successfully."